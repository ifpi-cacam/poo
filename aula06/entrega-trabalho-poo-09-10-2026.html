<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prazo Expirado - Entrega de POO</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      color: #17202a;
      background: #f5f7fb;
    }
    main {
      width: min(680px, 100%);
      padding: 34px;
      border: 1px solid #d7e0ea;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 18px 45px rgba(25, 42, 70, 0.12);
      text-align: center;
    }
    p.tag {
      margin: 0 0 10px;
      color: #164ec0;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 14px;
      font-size: clamp(2rem, 6vw, 3.2rem);
      line-height: 1.05;
    }
    p {
      margin: 0;
      color: #5d6b7a;
      font-size: 1.05rem;
      line-height: 1.55;
    }
  </style>
</head>
<body>
  <main>
    <p class="tag">Programacao Orientada a Objetos</p>
    <h1>Prazo expirado para envio de respostas</h1>
    <p>O formulario de entrega do trabalho de POO foi encerrado.</p>
  </main>
</body>
</html>
